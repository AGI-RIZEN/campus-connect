worker_processes auto;

events {
  worker_connections 4096;
}

http {
  # `api` resolves (via Docker's DNS) to every replica of the api service.
  # No sticky sessions needed: the app's Socket.io client uses transports: ['websocket']
  # only (lib/socket.ts), so each socket is one long-lived connection pinned to one
  # replica, and the Redis adapter fans chat events out across replicas.
  upstream campus_api {
    # Shared memory so all nginx worker processes see the same connection counts —
    # without it each worker balances on its own and they all pick the first replica.
    zone campus_api 64k;
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # Uploads (images/files) go through the API to Cloudinary.
    client_max_body_size 25m;

    location / {
      proxy_pass http://campus_api;
      proxy_http_version 1.1;

      # WebSocket upgrade (Socket.io chat)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Keep idle sockets open (Socket.io pings every ~25s)
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;

      # Retry another replica if one is down
      proxy_next_upstream error timeout http_502 http_503;
    }

    # Lets you see which replica answered: curl -i http://localhost:4000/health
    add_header X-Upstream $upstream_addr always;
  }
}
